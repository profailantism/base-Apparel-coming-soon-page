<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Base Apparel coming soon page</title>
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.svg" alt="">
    </div>
  </header>
  <main>
    <div class="hero-image">
      <picture>
        <source media="(min-width: 900px)" srcset="images/hero-desktop.jpg">
        <source media="(min-width: 375px)" srcset="images/hero-mobile.jpg">
        <img src="images/hero-mobile.jpg" alt="">
      </picture>
    </div>
    <div class="landing-wrapper">
      <h1><span>We're</span> coming soon</h1>
      <p class="announcements">Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
      <div class="email-wrapper">
        <input type="email" name="" id="" placeholder="Email Address" aria-label="Email Address" required>
        <button type="button">
          <img src="images/icon-arrow.svg" alt="">
        </button>
      </div>
    </div>
  </main>
</body>
</html>
